trigger:
  branches:
    include:
      - main
      - release/*

variables:
  imageName: 'payment-orders-service'
  registryUrl: 'registry.internal.example.com'
  tag: '$(Build.BuildId)'

stages:
  - stage: BuildAndScan
    displayName: 'Build Image & Shift-Left Security Gate'
    jobs:
      - job: BuildAndTrivyScan
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Docker@2
            displayName: 'Build Hardened Azure Linux 3.0 Image'
            inputs:
              command: 'build'
              Dockerfile: 'docker/Dockerfile'
              buildContext: '.'
              repository: '$(registryUrl)/$(imageName)'
              tags: '$(tag)'

          - script: |
              docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
                aquasec/trivy:latest image \
                --exit-code 1 \
                --severity CRITICAL,HIGH \
                --ignore-unfixed \
                $(registryUrl)/$(imageName):$(tag)
            displayName: 'Trivy Vulnerability Gate (Fail on Critical/High CVEs)'

          - task: Docker@2
            displayName: 'Push Verified Image to Private Registry'
            inputs:
              command: 'push'
              repository: '$(registryUrl)/$(imageName)'
              tags: '$(tag)'

  - stage: DeployUAT
    displayName: 'Deploy to UAT & Verify FIPS Provider'
    dependsOn: BuildAndScan
    jobs:
      - deployment: DeployUATJob
        environment: 'regulated-payments-uat'
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    kubectl apply -f kubernetes/deployment.yaml -n payment-orders
                    kubectl rollout status deployment/payment-orders-service -n payment-orders --timeout=180s
                  displayName: 'Apply Manifests & Verify Rollout'

  - stage: DeployProduction
    displayName: 'Deploy to Production (Approval Gated)'
    dependsOn: DeployUAT
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployProdJob
        environment: 'regulated-payments-prod'
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    kubectl apply -f kubernetes/deployment.yaml -n payment-orders
                    kubectl rollout status deployment/payment-orders-service -n payment-orders --timeout=180s
                  displayName: 'Production Deployment'
